apiVersion: v2
name: {{BRIDGE_CHART_NAME}}
description: |
  {{CUSTOMER_DISPLAY_NAME}} Bridge — thin wrapper over openg2p-bridge with private Celery image.
type: application
version: 0.0.0-develop
appVersion: "develop"

keywords:
  - openg2p
  - bridge
  - g2p-bridge
